[package]
name = "x-agent"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "X: voice-driven safe Actions and supervised OpenCode Work runs for Hex"

[dependencies]
libc = "0.2.189"
dirs = "7.0.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
tempfile = "3"
uuid = { version = "1", features = ["serde", "v4"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
] }

[lints]
workspace = true
